; VIEWE UEDX80480050E-WB 5" ESP32-S3 (ESP32-S3-WROOM-1-N16R8: 16 MB flash + 8 MB OPI PSRAM)
; 800x480 RGB parallel LCD (ST7262) + GT911 capacitive touch
; Bluetooth LE HID keyboard deck - no WiFi, no companion server.
;
; Board variant must stay the vendored boards/viewe-uedx80480050e-n16r8.json: the
; stock devkitc-1 definition never initialises octal PSRAM and the RGB framebuffer
; allocation fails at boot.

[env:viewe_5]
platform = espressif32@6.9.0
board = viewe-uedx80480050e-n16r8
framework = arduino

; huge_app.csv = single ~3 MB app slot, no OTA.
board_build.partitions = huge_app.csv

build_flags =
    ; Serial stays on UART0/CH340C; USB-CDC would fight the GT911 over GPIO19/20.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Iinclude

lib_deps =
    lvgl/lvgl@^8.4.0
    moononournation/GFX Library for Arduino@1.4.7
    T-vK/ESP32 BLE Keyboard@^0.3.2

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 460800
