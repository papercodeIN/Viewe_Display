; VIEWE UEDX80480050E-WB 5" ESP32-S3 (ESP32-S3-WROOM-1-N16R8: 16 MB flash + 8 MB OPI PSRAM)
; 800x480 RGB parallel LCD (ST7262) - WiFi NAS file server on the onboard microSD slot.
;
; Board variant must stay the vendored boards/viewe-uedx80480050e-n16r8.json: the
; stock devkitc-1 definition never initialises octal PSRAM and the RGB framebuffer
; allocation fails at boot.

[env:viewe_5]
platform = espressif32@6.9.0
board = viewe-uedx80480050e-n16r8
framework = arduino

; Custom 16 MB table with two 6.4 MB OTA app slots - ArduinoOTA needs both;
; the board default (huge_app.csv) has a single slot and no OTA.
board_build.partitions = partitions_16mb_ota.csv

build_flags =
    ; Serial stays on UART0/CH340C; USB-CDC would fight the GT911 over GPIO19/20.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -Iinclude

lib_deps =
    moononournation/GFX Library for Arduino@1.4.7
    ESP32Async/ESPAsyncWebServer@3.6.0
    ESP32Async/AsyncTCP@3.3.2

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
