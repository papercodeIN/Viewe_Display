; VIEWE UEDX80480050E-WB 5" ESP32-S3 (ESP32-S3-WROOM-1-N16R8: 16 MB flash + 8 MB OPI PSRAM)
; 800x480 RGB parallel LCD (ST7262) + GT911 capacitive touch
; Wireless second screen - MJPEG over TCP receiver, touch backchannel.
;
; Board variant must stay the vendored boards/viewe-uedx80480050e-n16r8.json: the
; stock devkitc-1 definition never initialises octal PSRAM and the RGB framebuffer
; allocation fails at boot. Same proven setup as the Digital Photo Frame project
; in this repository (espressif32@6.9.0 = arduino-esp32 2.0.14).
;
; Serial stays on UART0/CH340C; USB-CDC would fight the GT911 over GPIO19/20.

[env:viewe_5]
platform = espressif32@6.9.0
board = viewe-uedx80480050e-n16r8
framework = arduino

board_build.partitions = default_16MB.csv

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -Iinclude

lib_deps =
    moononournation/GFX Library for Arduino@1.4.7
    bodmer/TJpg_Decoder@1.1.0

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 460800
