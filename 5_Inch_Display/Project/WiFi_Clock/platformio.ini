; PlatformIO project for the VIEWE UEDX80480050E-WB-A 5" ESP32-S3 touch display
; (800x480 RGB IPS, GT911 touch, 16 MB flash, 8 MB PSRAM)
;
; Build:  pio run
; Upload: pio run -t upload
; Monitor: pio device monitor

[platformio]
default_envs = BOARD_VIEWE_UEDX80480050E_WB_A
; Isolated package store: several Espressif platform versions on this machine
; share ~/.platformio/packages and whichever builds last rewrites the shared
; "framework-arduinoespressif32" folder, breaking this project's pinned core.
; Keeping packages inside the project makes builds immune to that.
packages_dir = .pio/packages

[env]
framework = arduino
platform = espressif32
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0
    https://github.com/lvgl/lvgl.git#v8.4.0
    ArduinoJson@6.21.3

; Pin the Arduino core explicitly. Several official espressif32 platform
; versions are installed alongside the pioarduino fork and they share the
; same "framework-arduinoespressif32" package folder in ~/.platformio;
; whichever platform builds last rewrites the package metadata. Without this
; pin the pioarduino build intermittently fails with
; "TypeError: ... 'NoneType'" (FRAMEWORK_DIR = None).
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.9/esp32-core-3.3.9.tar.xz

[common]
; Paths are relative to the project root. The UI is a normal PlatformIO
; library in lib/ui and is picked up automatically.
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I .
    -I src
    -I lib/ui
    -I lib/ui/src

[rgb_lcd]
; RGB panels on the ESP32-S3 need byte swapping disabled
build_flags =
    -DLV_COLOR_16_SWAP=0

[env:BOARD_VIEWE_UEDX80480050E_WB_A]
board = BOARD_VIEWE_UEDX80480050E_WB_A
build_flags =
    ${common.build_flags}
    ${rgb_lcd.build_flags}
    -DESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
    -DBOARD_VIEWE_UEDX80480050E_WB_A
